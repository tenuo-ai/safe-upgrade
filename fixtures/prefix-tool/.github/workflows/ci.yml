# Complete, unlike the other fixture's workflow: this one runs both the tests and
# the build. A run against this repository should find nothing to add, which is the
# case the other fixture cannot exercise.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
