# Open a draft when you already know the exact version to move to.
#
# This is the scheduled / "new version exists" path. Name the package and version
# yourself (or have something else resolve "latest" to an exact version first).
# A range is refused: every claim a run makes is about one version it read.
#
# This copyable example uses safe-upgrade's explicit self-authorized trial mode.
# For production, remove NODE_ENV and supply TENUO_ROOT_PUBLIC_KEY,
# TENUO_RUN_WARRANT, and TENUO_RUN_HOLDER_SECRET from your warrant issuer.

name: Draft a known upgrade

on:
  workflow_dispatch:
    inputs:
      package:
        description: name@version, exact
        required: true

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.18"

      - name: Upgrade and open a draft if verified
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: development
          TARGET_PACKAGE: ${{ inputs.package }}
        run: |
          npx --yes @tenuo/safe-upgrade@0.1.0 "$TARGET_PACKAGE" --draft-pr --quiet
