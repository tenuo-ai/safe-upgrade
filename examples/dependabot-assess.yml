# Assess Dependabot and Renovate pull requests against the repository's own
# source and checks. The Action applies the requested release in a disposable
# repository copy, publishes a job summary, comments on the pull request, and
# attaches the complete evidence record to the workflow run.

name: Assess dependency upgrades

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  safe-upgrade:
    if: >-
      github.actor == 'dependabot[bot]' ||
      github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the base revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Assess the upgrade
        uses: tenuo-ai/safe-upgrade-action@v1
